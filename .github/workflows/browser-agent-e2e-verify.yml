name: 'Browser Agent E2E Verification'

on:
  push:
    branches:
      - 'test/browser-agent-e2e-verify'

jobs:
  e2e_linux:
    name: 'E2E - Linux'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Node.js 20.x'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Ensure Chrome is available'
        run: |
          if ! command -v google-chrome &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: 'Run browser agent integration tests'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
        run: 'npx vitest run --root ./integration-tests browser-agent.test.ts'

  e2e_macos:
    name: 'E2E - macOS'
    runs-on: 'macos-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Node.js 20.x'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Run browser agent integration tests'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
        run: 'npx vitest run --root ./integration-tests browser-agent.test.ts'

  e2e_windows:
    name: 'E2E - Windows'
    runs-on: 'windows-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Node.js 20.x'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'
        shell: 'pwsh'

      - name: 'Build project'
        run: 'npm run build'
        shell: 'pwsh'

      - name: 'Ensure Chrome is available'
        shell: 'pwsh'
        run: |
          $chromePaths = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chromeExists = $chromePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chromeExists) {
            Write-Host 'Chrome not found, installing via Chocolatey...'
            choco install googlechrome -y --no-progress --ignore-checksums
          }
          $installed = $chromePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($installed) {
            Write-Host "Chrome found at: $installed"
            & $installed --version
          } else {
            Write-Error 'Chrome installation failed'
            exit 1
          }

      - name: 'Run browser agent integration tests'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
        shell: 'pwsh'
        run: 'npx vitest run --root ./integration-tests browser-agent.test.ts'

  unit_tests:
    name: 'Unit Tests - browserManager'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Node.js 20.x'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Run browserManager unit tests'
        run: 'npm test -w @google/gemini-cli-core -- src/agents/browser/browserManager.test.ts'

      - name: 'Run lint'
        run: 'npx eslint integration-tests/browser-agent.test.ts packages/core/src/agents/browser/browserManager.ts packages/core/src/agents/browser/browserManager.test.ts'
